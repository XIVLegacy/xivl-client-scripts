name: Checks

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Corpus Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check changed-file whitespace
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          case "${EVENT_NAME}" in
            pull_request)
              git diff --check "${PR_BASE_SHA}...${PR_HEAD_SHA}"
              ;;
            push)
              if test "${BEFORE_SHA}" = "0000000000000000000000000000000000000000"; then
                git diff-tree --check --root -m -r "${CURRENT_SHA}"
              else
                git diff --check "${BEFORE_SHA}" "${CURRENT_SHA}"
              fi
              ;;
            workflow_dispatch)
              git diff-tree --check --root -m -r "${CURRENT_SHA}"
              ;;
            *)
              echo "unsupported event for revision check" >&2
              exit 1
              ;;
          esac
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the pinned test JDK
        shell: bash
        run: |
          set -euo pipefail
          jdk_archive="${RUNNER_TEMP}/OpenJDK21U-jdk_x64_linux_hotspot_21.0.12.1_1.tar.gz"
          jdk_root="${RUNNER_TEMP}/test-jdk"
          curl --silent --show-error --fail --location --max-time 600 \
            --max-filesize 250000000 \
            --output "${jdk_archive}" \
            "https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.12.1%2B1/OpenJDK21U-jdk_x64_linux_hotspot_21.0.12.1_1.tar.gz"
          echo "ce79869e1307ed8ee1e2baa86a412b1eb5b75d10a01006d788a6f968bcfaee94  ${jdk_archive}" | \
            sha256sum --check --status
          mkdir -p "${jdk_root}"
          tar -xzf "${jdk_archive}" -C "${jdk_root}"
          java_path="$(find "${jdk_root}" -type f -path '*/bin/java' -print -quit)"
          test -x "${java_path}"
          java_home="$(dirname "$(dirname "${java_path}")")"
          echo "JAVA_HOME=${java_home}" >> "${GITHUB_ENV}"
          echo "${java_home}/bin" >> "${GITHUB_PATH}"
      - name: Install jsonschema
        run: pip install jsonschema
      - name: Test restricted Lua archive tooling
        run: python tools/test_private_lua_corpus.py
      - name: Test retail Lua corpus contract
        run: python tools/test_retail_lua_corpus.py
      - name: Run retail script contract tests
        run: python tools/test_retail_script.py
      - name: Run strict gate
        run: python tools/validate_corpus.py
        env:
          XIVL_CORPUS_ABSENT: "1"
