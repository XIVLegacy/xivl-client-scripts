name: Retail Checks

on:
  workflow_dispatch:

concurrency:
  group: retail-checks
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  retail-preflight:
    name: Retail Preflight Checks
    outputs:
      public_commit: ${{ steps.commit.outputs.public_commit }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"

      - name: Reject untrusted dispatch refs
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = "workflow_dispatch"
          test "${GITHUB_REF}" = "refs/heads/main"
          test "${GITHUB_REF_TYPE}" = "branch"
          test "${GITHUB_SHA}" = "$(git rev-parse HEAD)"
          test "${GITHUB_SHA}" = "$(timeout 30s git ls-remote origin refs/heads/main | cut -f1)"
          case "${GITHUB_REF}" in
            refs/pull/*|refs/merge/*) exit 1 ;;
          esac

      - name: Pass only the approved public commit
        id: commit
        shell: bash
        run: echo "public_commit=${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Verify the fixed public grant
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s python tools/test_retail_script.py
          timeout 30s python tools/verify_retail_script.py --contract-only > "${RUNNER_TEMP}/asset-free-attestation.json"
          rm -f -- "${RUNNER_TEMP}/asset-free-attestation.json"

  battle-command-baseclass:
    name: Battle Command Script Checks
    needs: retail-preflight
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: retail-evidence
    steps:
      - name: Checkout approved public commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.retail-preflight.outputs.public_commit }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"

      - name: Fetch the immutable LPB blob
        id: fetch
        continue-on-error: true
        shell: bash
        env:
          RETAIL_INPUTS_REPOSITORY: ${{ vars.RETAIL_INPUTS_REPOSITORY }}
          RETAIL_INPUTS_TOKEN: ${{ secrets.RETAIL_INPUTS_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          private_root="${RUNNER_TEMP}/retail-script-private"
          api_root="${private_root}/api"
          input_root="${private_root}/input"
          mkdir -p "${api_root}" "${input_root}"
          trap 'rm -rf -- "${api_root}"' EXIT

          repository="XIVLegacy/xivl-retail-client-inputs"
          commit="abfddb3e8434af4ae36d55269088e489cc8050e5"
          expected_path="client-scripts/ffxiv-1.23b/client/script/7vxx9w6/39x5/89qqy57vxx9w689r57y9rr.le.lpb"
          test "${RETAIL_INPUTS_REPOSITORY}" = "${repository}"
          test -n "${RETAIL_INPUTS_TOKEN}"

          request() {
            local label="$1"
            local endpoint="$2"
            local output="$3"
            local http_status
            local curl_status

            set +e
            http_status="$(curl --silent --fail --location --max-time 180 \
              --max-filesize 4000000 \
              --header "Authorization: Bearer ${RETAIL_INPUTS_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --output "${output}" \
              --write-out '%{http_code}' \
              "https://api.github.com/repos/${repository}/${endpoint}" \
              2>> "${api_root}/curl.log")"
            curl_status=$?
            set -e

            if test "${curl_status}" -ne 0 || [[ "${http_status}" != 2?? ]]; then
              rm -f -- "${output}"
              printf 'Private API %s failed (curl %s, HTTP %s)\n' \
                "${label}" "${curl_status}" "${http_status}" >&2
              return 1
            fi
          }

          request commit "git/commits/${commit}" "${api_root}/commit.json"
          request compare "compare/${commit}...main" "${api_root}/compare.json"
          PRIVATE_ROOT="${private_root}" API_ROOT="${api_root}" \
          PINNED_COMMIT="${commit}" timeout 30s python - <<'PY'
          import json
          import os
          from pathlib import Path

          api = Path(os.environ["API_ROOT"])
          commit = os.environ["PINNED_COMMIT"]
          commit_doc = json.loads((api / "commit.json").read_text(encoding="utf-8"))
          compare_doc = json.loads((api / "compare.json").read_text(encoding="utf-8"))
          assert commit_doc.get("sha") == commit
          tree_sha = commit_doc.get("tree", {}).get("sha")
          assert isinstance(tree_sha, str) and len(tree_sha) == 40
          assert compare_doc.get("status") in {"ahead", "identical"}
          assert compare_doc.get("merge_base_commit", {}).get("sha") == commit
          (Path(os.environ["PRIVATE_ROOT"]) / "tree-sha").write_text(tree_sha + "\n", encoding="ascii")
          PY

          IFS= read -r tree_sha < "${private_root}/tree-sha"
          request tree "git/trees/${tree_sha}?recursive=1" "${api_root}/tree.json"
          PRIVATE_ROOT="${private_root}" API_ROOT="${api_root}" \
          EXPECTED_PATH="${expected_path}" timeout 30s python - <<'PY'
          import json
          import os
          from pathlib import Path

          expected_blobs = {
              "ffxivgame.exe": 15996808,
              "client-data/ffxiv-1.23b/client/script/rq9q1797qvs.san": 108911,
              "client-scripts/ffxiv-1.23b/client/script/7vxx9w6/39x5/89qqy57vxx9w689r57y9rr.le.lpb": 1507,
              "captures/pcap-1.23b/pcap-1.23b-objects.zip": 2622720,
          }
          expected_trees = {
              "/".join(path.split("/")[:depth])
              for path in expected_blobs
              for depth in range(1, len(path.split("/")))
          }
          tree = json.loads((Path(os.environ["API_ROOT"]) / "tree.json").read_text(encoding="utf-8"))
          entries = tree.get("tree")
          expected_tree = (Path(os.environ["PRIVATE_ROOT"]) / "tree-sha").read_text(
              encoding="ascii"
          ).strip()
          assert tree.get("sha") == expected_tree
          assert tree.get("truncated") is False
          assert isinstance(entries, list)
          by_path = {entry.get("path"): entry for entry in entries}
          assert len(by_path) == len(entries)
          assert set(by_path) == set(expected_blobs) | expected_trees
          for path, size in expected_blobs.items():
              entry = by_path[path]
              assert entry.get("type") == "blob"
              assert entry.get("mode") == "100644"
              assert entry.get("size") == size
          for path in expected_trees:
              entry = by_path[path]
              assert entry.get("type") == "tree"
              assert entry.get("mode") == "040000"
          entry = by_path[os.environ["EXPECTED_PATH"]]
          blob_sha = entry.get("sha")
          assert isinstance(blob_sha, str) and len(blob_sha) == 40
          (Path(os.environ["PRIVATE_ROOT"]) / "blob-sha").write_text(blob_sha + "\n", encoding="ascii")
          PY

          IFS= read -r blob_sha < "${private_root}/blob-sha"
          request blob "git/blobs/${blob_sha}" "${api_root}/blob.json"
          API_ROOT="${api_root}" INPUT_ROOT="${input_root}" BLOB_SHA="${blob_sha}" \
          timeout 30s python - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          document = json.loads((Path(os.environ["API_ROOT"]) / "blob.json").read_text(encoding="utf-8"))
          assert document.get("sha") == os.environ["BLOB_SHA"]
          assert document.get("size") == 1507
          assert document.get("encoding") == "base64"
          content = "".join(document["content"].split())
          data = base64.b64decode(content, validate=True)
          assert len(data) == 1507
          (Path(os.environ["INPUT_ROOT"]) / "89qqy57vxx9w689r57y9rr.le.lpb").write_bytes(data)
          PY

      - name: Verify LPB input identity
        id: identity
        if: steps.fetch.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          input="${RUNNER_TEMP}/retail-script-private/input/89qqy57vxx9w689r57y9rr.le.lpb"
          test "$(stat --format=%s "${input}")" = "1507"
          test "$(sha256sum "${input}" | cut -d ' ' -f 1)" = \
            "74761459950b4dbafab6c879ea9a4c1437d4bfe8084058be2023e32add32e569"

      - name: Install the pinned Temurin JDK
        id: toolchain
        if: steps.identity.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          toolchain="${RUNNER_TEMP}/retail-script-private/toolchain"
          mkdir -p "${toolchain}/jdk"
          archive="${toolchain}/OpenJDK21U-jdk_x64_linux_hotspot_21.0.12.1_1.tar.gz"
          curl --silent --fail --location --max-time 600 \
            --max-filesize 200000000 \
            --output "${archive}" \
            "https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.12.1%2B1/OpenJDK21U-jdk_x64_linux_hotspot_21.0.12.1_1.tar.gz" \
            2>> "${RUNNER_TEMP}/retail-script-private/toolchain-curl.log"
          echo "ce79869e1307ed8ee1e2baa86a412b1eb5b75d10a01006d788a6f968bcfaee94  ${archive}" | sha256sum --check --status
          tar -xzf "${archive}" -C "${toolchain}/jdk"
          java_path="$(find "${toolchain}/jdk" -type f -path '*/bin/java' -print -quit)"
          test -x "${java_path}"
          java_home="$(dirname "$(dirname "${java_path}")")"
          echo "JAVA_HOME=${java_home}" >> "${GITHUB_ENV}"
          echo "${java_home}/bin" >> "${GITHUB_PATH}"

      - name: Reproduce the tracked BattleCommandBaseClass script
        id: analysis
        if: steps.identity.outcome == 'success' && steps.toolchain.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          private_root="${RUNNER_TEMP}/retail-script-private"
          mkdir -p "${GITHUB_WORKSPACE}/_retail-staging"
          timeout 180s python tools/retail_script.py \
            --input "${private_root}/input/89qqy57vxx9w689r57y9rr.le.lpb" \
            --jar "${GITHUB_WORKSPACE}/tools/vendor/unluac/unluac_2025_12_23.jar" \
            --decoded-out "${private_root}/decoded.luac" \
            --script-out "${private_root}/decompiled.lua" \
            > "${private_root}/pipeline.log" 2>&1
          timeout 30s python tools/verify_retail_script.py \
            --decoded "${private_root}/decoded.luac" \
            --script "${private_root}/decompiled.lua" \
            > "${GITHUB_WORKSPACE}/_retail-staging/retail-evidence-attestation.json" \
            2> "${private_root}/verifier.log"

          SCRIPT="${private_root}/decompiled.lua" MUTATED="${private_root}/mutated.lua" timeout 30s python - <<'PY'
          import os
          from pathlib import Path

          data = Path(os.environ["SCRIPT"]).read_bytes()
          assert data
          Path(os.environ["MUTATED"]).write_bytes(data[:-1] + bytes([data[-1] ^ 1]))
          PY
          set +e
          timeout 30s python tools/verify_retail_script.py \
            --decoded "${private_root}/decoded.luac" \
            --script "${private_root}/mutated.lua" \
            > "${private_root}/negative-attestation.json" 2> "${private_root}/negative.log"
          negative_status=$?
          set -e
          test "${negative_status}" -ne 0

      - name: Create a sanitized failure attestation
        if: always() && steps.analysis.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/_retail-staging"
          set +e
          timeout 30s python tools/verify_retail_script.py \
            --decoded "${RUNNER_TEMP}/retail-script-private/missing.luac" \
            --script "${RUNNER_TEMP}/retail-script-private/missing.lua" \
            > "${GITHUB_WORKSPACE}/_retail-staging/retail-evidence-attestation.json" 2> /dev/null
          status=$?
          set -e
          test "${status}" -ne 0

      - name: Remove all private script material
        id: cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf -- "${RUNNER_TEMP}/retail-script-private"

      - name: Validate the only retained file
        id: allowlist
        if: always() && steps.cleanup.outcome == 'success' && hashFiles('_retail-staging/retail-evidence-attestation.json') != ''
        shell: bash
        run: |
          set -euo pipefail
          retained="$(find _retail-staging -mindepth 1 -print)"
          test "${retained}" = "_retail-staging/retail-evidence-attestation.json"
          test -f _retail-staging/retail-evidence-attestation.json
          test ! -L _retail-staging/retail-evidence-attestation.json
          timeout 30s python tools/verify_retail_script.py \
            --validate-attestation _retail-staging/retail-evidence-attestation.json

      - name: Upload the sanitized attestation
        if: always() && steps.cleanup.outcome == 'success' && steps.allowlist.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: retail-script-attestation
          path: _retail-staging/retail-evidence-attestation.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          overwrite: false
          include-hidden-files: false

      - name: Preserve a failed evidence result
        if: always() && steps.analysis.outcome != 'success'
        shell: bash
        run: exit 1
